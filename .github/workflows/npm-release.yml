name: npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v26.10.17)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for provenance
        run: npm install -g npm@^11.5.1

      - name: Verify CalVer and version match
        env:
          TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version_file="$(tr -d '[:space:]' < VERSION)"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$TARGET_TAG" != "v${version_file}" ]]; then
            echo "Tag ${TARGET_TAG} does not match VERSION ${version_file}." >&2
            exit 1
          fi
          if [[ "$pkg_version" != "$version_file" ]]; then
            echo "package.json version ${pkg_version} does not match VERSION ${version_file}." >&2
            exit 1
          fi
          if [[ ! "$version_file" =~ ^[0-9]{2}\.(1[0-2]|[1-9])\.([1-9]|[12][0-9]|3[01])$ ]]; then
            echo "VERSION ${version_file} is not unpadded CalVer YY.M.D." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install dprint
        run: npm install -g dprint@0.57.4

      - name: Check format and types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check whether this version is already on npm
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          found="$(npm view "@tranthethang/agent-relay@${version}" version 2>/dev/null || true)"
          if [[ "$found" == "$version" ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Version ${version} is already on npm; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm latest
        if: steps.published.outputs.already != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag latest
