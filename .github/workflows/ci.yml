name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh -s -- 0.57.4
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: make fmt-check

  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dprint
        run: npm install -g dprint@0.57.4

      - name: Install dependencies
        run: npm ci

      - name: Check format and types
        run: npm run check

      - name: Check reference sync
        run: npm run sync:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage report
        if: runner.os == 'Linux'
        run: npm run coverage:report

      - name: Run skill evals
        run: npm run evals
