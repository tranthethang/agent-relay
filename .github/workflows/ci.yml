name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bootstrap sync
        run: bash ./scripts/sync-bootstrap.sh --check

      - name: Run local smoke tests
        run: bash ./tests/smoke.sh

      - name: Run remote smoke tests
        run: bash ./tests/smoke-remote.sh
