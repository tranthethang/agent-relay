name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Raise X and set Z to 0"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse unless main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release runs on refs/heads/main. Current ref is ${GITHUB_REF}." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute the next version
        id: version
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          set -euo pipefail
          if [ "${{ inputs.major }}" = "true" ]; then
            version="$(node --experimental-strip-types scripts/maint/next-version.ts --major)"
          else
            version="$(node --experimental-strip-types scripts/maint/next-version.ts)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check requires-atry
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/maint/next-version.ts --check-requires "${{ steps.version.outputs.version }}"

      # The tests expect the dev build and `package.json` at 0.0.0. Run them
      # before the version is set; `npm test` builds first.
      - name: Test
        run: npm test

      # The build reads the version from `package.json`. Set it first, so the
      # bundle and `dist/package.json` report the release version.
      - name: Set the package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Install dprint
        run: npm install -g dprint@0.57.4

      - name: Check format and types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check the tarball holds the skills
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e '
          const pack = require("./pack.json");
          const entry = Array.isArray(pack) ? pack[0] : Object.values(pack)[0];
          const files = entry.files.map((file) => file.path);
          const need = [
            "atry-brainstorm",
            "atry-cross-review",
            "atry-distill",
            "atry-implement",
            "atry-plan",
            "atry-self-review",
          ];
          const missing = need.filter((name) => !files.includes(`skills/${name}/SKILL.md`));
          if (missing.length > 0) {
            console.error(`tarball lacks: ${missing.join(", ")}`);
            process.exit(1);
          }
          console.log("tarball holds the six skills");
          '
          rm -f pack.json

      # Install the packed tarball and smoke it before anything leaves the
      # runner. A failure here pushes no tag and publishes nothing.
      - name: Install the packed tarball into a temporary prefix
        run: |
          set -euo pipefail
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          prefix="${RUNNER_TEMP}/atry-prepublish"
          npm install --prefix "$prefix" "${RUNNER_TEMP}/${tarball}"
          echo "${prefix}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Smoke the packed tarball
        uses: ./.github/actions/smoke
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Push the tag
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. Node 22 ships npm 10.
      - name: Install npm for trusted publishing
        run: npm install -g npm@11.15.0

      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest

  # This job installs the published tarball. It proves that the registry serves
  # the same working package that `publish` smoked before it was published.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install the published package into a temporary prefix
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/atry-smoke"
          # The registry can lag minutes behind `npm publish`, and its metadata
          # is cached. Poll with `--prefer-online` for up to ten minutes.
          attempts=30
          for attempt in $(seq 1 "$attempts"); do
            seen="$(npm view "@tranthethang/agent-relay@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "$seen" = "$VERSION" ]; then
              break
            fi
            if [ "$attempt" = "$attempts" ]; then
              echo "${VERSION} is not visible after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 20
          done
          npm install --prefer-online --prefix "$prefix" "@tranthethang/agent-relay@${VERSION}"
          echo "${prefix}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Smoke the published CLI and skills
        uses: ./.github/actions/smoke
        with:
          version: ${{ needs.publish.outputs.version }}

      # The GitHub Release marks a finished release, so it waits for the smoke.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.publish.outputs.version }}" --repo "${{ github.repository }}" --generate-notes
