# SonarQube analysis for agent-relay
# Stack: Node.js 22, TypeScript CLI (tsup), Vitest, dprint
# Docs: https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=agent-relay
sonar.projectName=Agent Relay
# package.json stays 0.0.0; the release workflow sets the published version.
sonar.projectVersion=0.0.0

sonar.sourceEncoding=UTF-8

# Handwritten TypeScript. Skill markdown under skills/ and docs/ is not analyzed.
sonar.sources=\
  src,\
  scripts/maint,\
  tsup.config.ts,\
  vitest.config.ts

sonar.tests=test
sonar.typescript.tsconfigPath=tsconfig.json

# Vitest — see vitest.config.ts (test/**/*.test.ts)
sonar.test.inclusions=test/**/*.test.ts

# `npm run coverage` writes Istanbul JSON (coverage/coverage-final.json) and
# coverage/files.json. The JS/TS analyzer imports LCOV only. Add "lcov" to
# vitest coverage.reporter, then set:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bundle, fixtures, and local run state
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.tmp-test/**,\
  **/.agent-relay/**,\
  **/.codegraph/**

# Connection (set via environment or scanner CLI; do not commit secrets)
# sonar.host.url=http://localhost:9000
# sonar.token=<SONAR_TOKEN>
