# agent-relay target manifest
#
# One block per tool. bin/install.sh, bin/uninstall.sh, and bin/verify.sh source this file,
# so keep it valid bash. Paths are absolute under $HOME (global install).
#
# FORMAT tells install.sh how to lay each skill out on disk:
#   skill-folder -> <DIR>/<name>/…  (copies the whole skills/<name>/ bundle:
#                                    SKILL.md, references/, scripts/)
#
# Add a new tool by adding one block here — install.sh does not need editing
# unless you introduce a new FORMAT. Only skill-folder is supported.

# Cursor Agent Skills (personal / global). Not ~/.cursor/skills-cursor (reserved).
CURSOR_DIR="$HOME/.cursor/skills"
CURSOR_FORMAT="skill-folder"

# Antigravity loads global skills from ~/.gemini/config/skills/.
ANTIGRAVITY_DIR="$HOME/.gemini/config/skills"
ANTIGRAVITY_FORMAT="skill-folder"

# Claude Code Agent Skills (personal / global).
CLAUDE_DIR="$HOME/.claude/skills"
CLAUDE_FORMAT="skill-folder"

# Codex Agent Skills (personal / global).
CODEX_DIR="$HOME/.codex/skills"
CODEX_FORMAT="skill-folder"

# Registered tool names, in install order. Keep in sync with the *_DIR vars above.
TOOLS=(CURSOR ANTIGRAVITY CLAUDE CODEX)
