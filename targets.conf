# agent-relay target manifest
#
# One block per tool. install.sh / uninstall.sh / verify.sh source this file,
# so keep it valid bash. Paths are absolute under $HOME (global install).
#
# FORMAT tells install.sh how to lay each skill out on disk:
#   mdc-flat     -> <DIR>/<name>.mdc            (Cursor rules layout)
#   skill-folder -> <DIR>/<name>/SKILL.md        (Agent Skills layout)
#
# Optional <TOOL>_LEGACY_DIRS=(...) lists previous install roots; install.sh
# and uninstall.sh remove matching skills there (both .mdc and skill-folder
# layouts) without failing if they are absent.
#
# Add a new tool by adding one block here — install.sh does not need editing
# unless you introduce a new FORMAT.

# Cursor Agent Skills (personal / global). Not ~/.cursor/skills-cursor (reserved).
CURSOR_DIR="$HOME/.cursor/skills"
CURSOR_FORMAT="skill-folder"
# Previous install as Cursor rules (.mdc); cleaned on install/uninstall.
CURSOR_LEGACY_DIRS=("$HOME/.cursor/rules")

# Antigravity loads global skills from ~/.gemini/config/skills/.
ANTIGRAVITY_DIR="$HOME/.gemini/config/skills"
ANTIGRAVITY_FORMAT="skill-folder"
# Previous install locations; uninstall.sh removes matching skills here too.
ANTIGRAVITY_LEGACY_DIRS=("$HOME/.agents/skills" "$HOME/.agent/skills")

# --- Placeholders for future targets, uncomment and fill in when supported ---
# CODEX_DIR="$HOME/.codex/skills"
# CODEX_FORMAT="skill-folder"
#
# CLAUDE_DIR="$HOME/.claude/skills"
# CLAUDE_FORMAT="skill-folder"

# Registered tool names, in install order. Keep in sync with the *_DIR vars above.
TOOLS=(CURSOR ANTIGRAVITY)
