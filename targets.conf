# agent-relay target manifest
#
# One block per tool. install.sh / uninstall.sh / verify.sh source this file,
# so keep it valid bash. Paths are absolute under $HOME (global install).
#
# FORMAT tells install.sh how to lay each skill out on disk:
#   mdc-flat     -> <DIR>/<name>.mdc            (Cursor: ~/.cursor/rules/*.mdc)
#   skill-folder -> <DIR>/<name>/SKILL.md        (Antigravity / Agent Skills layout)
#
# Add a new tool by adding one block here — install.sh does not need editing
# unless you introduce a new FORMAT.

CURSOR_DIR="$HOME/.cursor/rules"
CURSOR_FORMAT="mdc-flat"

# Canonical global path is ~/.agents/skills (plural). Antigravity still
# recognizes the legacy ~/.agent/skills path, but new installs should use .agents.
ANTIGRAVITY_DIR="$HOME/.agents/skills"
ANTIGRAVITY_FORMAT="skill-folder"

# --- Placeholders for future targets, uncomment and fill in when supported ---
# CODEX_DIR="$HOME/.codex/skills"
# CODEX_FORMAT="skill-folder"
#
# CLAUDE_DIR="$HOME/.claude/skills"
# CLAUDE_FORMAT="skill-folder"

# Registered tool names, in install order. Keep in sync with the *_DIR vars above.
TOOLS=(CURSOR ANTIGRAVITY)
